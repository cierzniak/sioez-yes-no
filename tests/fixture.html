<!-- Syntetyczny markup modala SIOEZ: sekcja egzaminatora (R*, P*) i druga rola z prefiksem SE -->
<button id="PrettyAlertOk" type="button">OK</button>
<form id="CandidateExaminerPracticePrwResultAddForm">
  <div class="modal-body" style="max-height: 500px;">
    <div id="content">
      <div style="display:block; width: 140px">
        <div><label for="R1_1">R1_1</label></div>
        <div class="radio yes"><div class="radioContainer"><input name="R1_1" type="radio" value="1"></div></div>
        <div class="radio no"><div class="radioContainer"><input name="R1_1" type="radio" value="2"></div></div>
      </div>
      <div style="display:block; width: 140px">
        <div><label for="R1_2">R1_2</label></div>
        <div class="radio yes"><div class="radioContainer"><input name="R1_2" type="radio" value="1"></div></div>
        <div class="radio no"><div class="radioContainer"><input name="R1_2" type="radio" value="2"></div></div>
      </div>
      <hr>
      <div style="display:block; width: 140px">
        <div><label for="R2_1">R2_1</label></div>
        <div class="radio yes"><div class="radioContainer"><input name="R2_1" type="radio" value="1"></div></div>
        <div class="radio no"><div class="radioContainer"><input name="R2_1" type="radio" value="2"></div></div>
      </div>
      <hr>
      <div style="display:block; width: 140px">
        <div><label for="P1_1">P1_1</label></div>
        <div class="radio yes"><div class="radioContainer"><input name="P1_1" type="radio" value="1"></div></div>
        <div class="radio no"><div class="radioContainer"><input name="P1_1" type="radio" value="2"></div></div>
      </div>
    </div>
    <div id="content">
      <div style="display:block; width: 140px">
        <div><label for="SER1_1">R1_1</label></div>
        <div class="radio yes"><div class="radioContainer"><input name="SER1_1" type="radio" value="1"></div></div>
        <div class="radio no"><div class="radioContainer"><input name="SER1_1" type="radio" value="2"></div></div>
      </div>
      <div style="display:block; width: 140px">
        <div><label for="SER2_1">R2_1</label></div>
        <div class="radio yes"><div class="radioContainer"><input name="SER2_1" type="radio" value="1"></div></div>
        <div class="radio no"><div class="radioContainer"><input name="SER2_1" type="radio" value="2"></div></div>
      </div>
    </div>
  </div>
  <div class="modal-footer">
    <button class="btn-custom-save" id="submitExaminerPrw" type="button">ZAPISZ</button>
    <button class="btn-custom-return" type="button">ANULUJ</button>
  </div>
</form>
